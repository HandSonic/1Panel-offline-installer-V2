# Same resolver/staging validation as GitHub; CNB supplies release transport.
# Tags identify releases but cannot certify attachment completeness.
.pipeline: &pipeline
  - name: Build available offline packages
    runner:
      tags: cnb:arch:amd64
      cpus: 4
    docker:
      image: ubuntu:22.04
    services: [docker]
    stages:
      - name: Dependencies and tests
        script: |
          set -e
          apt-get update
          apt-get install -y bash curl python3 git ca-certificates
          python3 -m unittest discover -s tests -v
      - name: Resolve versions
        script: python3 scripts/release.py plan --provider cnb
        exports:
          VERSION: VERSION
          MODE: MODE
          DOCKER_VERSION: DOCKER_VERSION
          COMPOSE_VERSION: COMPOSE_VERSION
          CUSTOM_REPO: CUSTOM_REPO
          FINGERPRINT: FINGERPRINT
          BUILD: BUILD
      - name: Build and validate
        if: test "$BUILD" = "1"
        script: |
          set -e
          export BUILD_FINGERPRINT="$FINGERPRINT"
          bash prepare_offline.sh --mode "$MODE" --app_version "$VERSION" \
            --docker_version "$DOCKER_VERSION" --compose_version "$COMPOSE_VERSION" \
            --custom_repo "$CUSTOM_REPO" --allow-missing
          python3 scripts/release.py stage --provider cnb
        exports:
          HAS_PACKAGES: HAS_PACKAGES
      - name: Ensure release tag
        if: test "$HAS_PACKAGES" = "1"
        script: |
          set -e
          git config user.name "CNB Bot"
          git config user.email "bot@cnb.cool"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            git tag "$VERSION"
            git push origin "refs/tags/$VERSION"
          fi
      - name: Create CNB release
        if: test "$HAS_PACKAGES" = "1"
        type: git:release
        options:
          tag: ${VERSION}
          title: ${VERSION}
          description: "Available offline packages; manifest.json records actual dependencies and deferred architectures. Incomplete builds retry automatically."
          overlying: true
      - name: Upload validated current files
        if: test "$HAS_PACKAGES" = "1"
        image: cnbcool/attachments:latest
        settings:
          tag: ${VERSION}
          attachments:
            - build/release-assets/*
master:
  push: *pipeline
  "crontab: 0 3 * * *": *pipeline
  web_trigger_build: *pipeline
