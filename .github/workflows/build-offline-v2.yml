name: Build 1Panel v2 Offline
on:
  push:
    branches: [master]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Download channel
        type: choice
        options: [stable, beta, dev]
        default: stable
      version:
        description: '1Panel version; empty discovers latest'
        default: ''
      force:
        description: Rebuild even when the complete manifest matches
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: offline-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODE: ${{ inputs.mode || 'stable' }}
      INPUT_VERSION: ${{ inputs.version }}
      FORCE_BUILD: ${{ inputs.force && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Resolve versions and check complete manifest
        id: plan
        run: python3 scripts/release.py plan
      - uses: actions/cache@v4
        if: steps.plan.outputs.build == '1'
        with:
          path: build/cache
          key: offline-downloads-${{ runner.os }}-${{ steps.plan.outputs.version }}-${{ steps.plan.outputs.fingerprint }}
          restore-keys: |
            offline-downloads-${{ runner.os }}-${{ steps.plan.outputs.version }}-
            offline-downloads-${{ runner.os }}-
      - name: Build available offline packages
        if: steps.plan.outputs.build == '1'
        env:
          APP_VERSION: ${{ steps.plan.outputs.version }}
          INSTALL_MODE: ${{ steps.plan.outputs.mode }}
          DOCKER_VERSION: ${{ steps.plan.outputs.docker_version }}
          COMPOSE_VERSION: ${{ steps.plan.outputs.compose_version }}
          BUILD_FINGERPRINT: ${{ steps.plan.outputs.fingerprint }}
          CUSTOM_REPO: ${{ steps.plan.outputs.custom_repo }}
        run: |
          bash prepare_offline.sh --mode "$INSTALL_MODE" --app_version "$APP_VERSION" \
            --docker_version "$DOCKER_VERSION" --compose_version "$COMPOSE_VERSION" \
            --custom_repo "$CUSTOM_REPO" --allow-missing
      - name: Validate and stage current artifacts
        if: steps.plan.outputs.build == '1'
        id: stage
        run: python3 scripts/release.py stage
      - name: Keep reviewable artifacts
        if: steps.stage.outputs.has_packages == '1'
        uses: actions/upload-artifact@v4
        with:
          name: offline-${{ steps.plan.outputs.version }}-${{ github.run_id }}
          path: build/release-assets/*
          if-no-files-found: error
      - name: Publish verified artifacts
        if: steps.stage.outputs.has_packages == '1' && github.ref == 'refs/heads/master'
        run: python3 scripts/release.py publish
      - name: Build summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              for manifest in Path('build').glob('v*/manifest.json'):
                  data = json.loads(manifest.read_text())
                  output.write(f"### {data['version']}\n\n")
                  for item in data['packages']:
                      output.write(f"- {item['source']}/{item['arch']}: {item['status']} {item.get('reason', '')}\n")
          PY
