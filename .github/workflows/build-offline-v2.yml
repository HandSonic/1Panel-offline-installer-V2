name: Build 1Panel v2 Offline
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Install mode: stable | beta | dev'
        default: stable
      version:
        description: '1Panel version; empty resolves latest'
        default: ''
      release_tag:
        description: 'Release tag; use a new correction tag for an existing public version'
        default: ''
permissions:
  contents: write
concurrency:
  group: offline-release
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated regression and syntax checks
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile scripts/*.py
          bash -n prepare_offline.sh upgrade_offline.sh quick_start.sh
  build:
    if: github.event_name != 'pull_request'
    needs: regression
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version and explicit matrix
        id: version
        run: |
          set -euo pipefail
          mode=${INPUT_MODE:-stable}
          [[ "$mode" =~ ^(stable|beta|dev)$ ]]
          version=${INPUT_VERSION:-$(curl --retry 3 -fsSL "https://resource.fit2cloud.com/1panel/package/v2/${mode}/latest")}
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          release_tag=${INPUT_RELEASE_TAG:-$version}
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9._-]*$ ]]
          if gh release view "$release_tag" --json isDraft -q '.isDraft' > release-state.txt 2>/dev/null; then
            [[ "$(cat release-state.txt)" == true ]] || { echo 'Public release already exists. Supply a new release_tag for the reviewed correction.'; exit 1; }
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          matrix="release-matrix-${version}.json"
          if [[ ! -f "$matrix" ]]; then
            # A new version defaults to all architectures; exceptions require review.
            python3 -c 'import json; a=list(json.load(open("docker-sources.json"))); json.dump({"official":a,"custom":a},open("release-matrix-full.json","w"))'
            matrix=release-matrix-full.json
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Build every declared source and architecture
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MODE: ${{ steps.version.outputs.mode }}
          MATRIX: ${{ steps.version.outputs.matrix }}
        run: |
          set -euo pipefail
          while read -r source arches; do
            case "$source" in
              enterprise-original|enterprise-docker) continue ;;
            esac
            bash prepare_offline.sh --mode "$MODE" --app_version "$VERSION" --source "$source" --arch "$arches"
          done < <(python3 -c 'import json,sys; [print(s,",".join(a)) for s,a in json.load(open(sys.argv[1])).items()]' "$MATRIX")
          if [[ -f "enterprise-sources-$VERSION.json" ]]; then
            for arch in $(python3 -c 'import json,sys; print(" ".join(json.load(open(sys.argv[1]))))' "enterprise-sources-$VERSION.json"); do
              python3 scripts/prepare_enterprise.py --version "$VERSION" --arch "$arch"
            done
          fi
          # Each source build has its own checksum list; consolidate all flat assets.
          (cd "build/$VERSION"; find . -mindepth 2 -maxdepth 2 -name '*.tar.gz' -print0 | sort -z | xargs -0 sha256sum | sed -E 's@  ./[^/]+/@  @' > checksums.txt)
          python3 scripts/validate_release.py "build/$VERSION" "$VERSION" "$MATRIX"
      - name: Stage verified assets in a draft, then publish
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          MATRIX: ${{ steps.version.outputs.matrix }}
        run: |
          set -euo pipefail
          # Never overwrite a public release piecemeal. A correction is a new release tag.
          if gh release view "$RELEASE_TAG" --json isDraft -q '.isDraft' > release-state.txt 2>/dev/null; then
            [[ "$(cat release-state.txt)" == true ]] || { echo 'Public release already exists; use a reviewed correction tag/process.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --draft --title "$VERSION" --notes 'Validated offline payloads; see included source manifests.'
          fi
          mapfile -t assets < <(find "build/$VERSION" -mindepth 2 -maxdepth 2 -name '*.tar.gz' | sort)
          gh release upload "$RELEASE_TAG" "${assets[@]}" "build/$VERSION/checksums.txt" --clobber
          # Verify remote asset completeness before making the draft visible.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > remote-assets.json
          python3 - "$VERSION" "$MATRIX" <<'PY'
          import hashlib,json,sys
          version,matrix=sys.argv[1:]
          wanted={f'1panel-{version}-{s}-offline-linux-{a}.tar.gz' for s,arches in json.load(open(matrix)).items() for a in arches}|{'checksums.txt'}
          assets=json.load(open('remote-assets.json'))['assets']
          assert {a['name'] for a in assets}==wanted, 'Remote asset matrix mismatch'
          expected={}
          for line in open(f'build/{version}/checksums.txt'):
              digest,name=line.rstrip().split('  ',1); expected[name]='sha256:'+digest
          expected['checksums.txt']='sha256:'+hashlib.sha256(open(f'build/{version}/checksums.txt','rb').read()).hexdigest()
          assert all(a['size']>0 and a.get('digest')==expected[a['name']] for a in assets), 'Remote content digest mismatch'
          PY
          gh release edit "$RELEASE_TAG" --draft=false
