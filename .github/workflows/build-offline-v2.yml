name: Build 1Panel v2 Offline
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Install mode: stable | beta | dev'
        default: stable
      version:
        description: '1Panel version; empty resolves latest only for normal builds'
        default: ''
      operation:
        type: choice
        options: [build, validate-repair, repair-existing]
        default: build
        description: Build packages, validate repair candidates, or publish a native-admitted repair
      upstream_source:
        type: choice
        options: [release, verified-ci]
        default: release
      upstream_run_id:
        description: Exact successful upstream run ID for verified-ci
        default: ''
      upstream_artifact_id:
        description: Exact upstream artifact ID for verified-ci
        default: ''
      upstream_artifact_sha256:
        description: Exact GitHub ZIP SHA-256 for verified-ci
        default: ''
      upstream_build_commit:
        description: Exact manifest built commit, possibly a PR merge commit
        default: ''
      candidate_predecessor:
        description: 'Read-only validate-repair only: JSON pins for an independently built predecessor candidate'
        default: ''
      release_tag:
        description: 'Release tag; empty uses the resolved application version'
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  # Admission is independent of branch, operation and unresolved latest inputs.
  # Only the release writer jobs below hold a shared release lock.
  group: offline-run-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned validation dependency in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - name: Run isolated regression and syntax checks
        env:
          CANDIDATE_PREDECESSOR: ''
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile scripts/*.py
          bash -n prepare_offline.sh upgrade_offline.sh quick_start.sh
  build_plan:
    if: ${{ !cancelled() && needs.regression.result == 'success' && (github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'build')) }}
    needs: regression
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      mode: ${{ steps.version.outputs.mode }}
      build_required: ${{ steps.version.outputs.build_required }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version and explicit matrix
        id: version
        run: |
          set -euo pipefail
          mode=${INPUT_MODE:-stable}
          [[ "$mode" =~ ^(stable|beta|dev)$ ]]
          version=${INPUT_VERSION:-$(curl --retry 3 -fsSL "https://resource.fit2cloud.com/1panel/package/v2/${mode}/latest")}
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          release_tag=${INPUT_RELEASE_TAG:-$version}
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9._-]*$ ]]
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          VERSION="$version" MODE="$mode" python3 - <<'PYCODE'
          import os,sys
          sys.path.insert(0,'scripts')
          from resolved_inventory import version_identity
          version_identity(os.environ['VERSION'],os.environ['MODE'])
          PYCODE
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo 'build_required=true' >> "$GITHUB_OUTPUT"

  build:
    concurrency:
      group: offline-release-${{ needs.build_plan.outputs.release_tag }}
      queue: max
      cancel-in-progress: false
    needs: [build_plan, publication_plan, publication_acceptance]
    if: ${{ !cancelled() && inputs.candidate_predecessor == '' && needs.build_plan.result == 'success' && needs.publication_plan.outputs.build_required == 'true' && needs.publication_acceptance.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.publication_plan.outputs.version }}
      RELEASE_TAG: ${{ needs.publication_plan.outputs.release_tag }}
      PUBLICATION_OPERATION: build
      ONEPANEL_RESOLVED_PLAN: ${{ github.workspace }}/matrix-input/plan.json
      ONEPANEL_RESOLVED_PLAN_SHA256: ${{ needs.publication_plan.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install validation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publication_plan.outputs.plan_artifact_id }}
          path: matrix-input
          merge-multiple: true
      - name: Authenticate admitted artifacts and publish recoverably
        env:
          CANDIDATE_PREDECESSOR: ${{ inputs.candidate_predecessor }}
          ACCEPTED_ARTIFACT_ID: ${{ needs.publication_acceptance.outputs.artifact_id }}
          EXPECTED_RECEIPT_SHA256: ${{ needs.publication_acceptance.outputs.receipt_sha256 }}
          EXPECTED_NATIVE_SHA256: ${{ needs.publication_acceptance.outputs.native_acceptance_sha256 }}
        run: |
          python3 scripts/runtime_publication.py publish --repository "$GITHUB_REPOSITORY" --version "$VERSION" --tag "$RELEASE_TAG" \
            --artifact-id "$ACCEPTED_ARTIFACT_ID" --receipt-sha256 "$EXPECTED_RECEIPT_SHA256" \
            --native-acceptance-sha256 "$EXPECTED_NATIVE_SHA256" --journal publication-work/control/repair-journal.json
      - name: Preserve publication journal on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-work/control/
          if-no-files-found: warn
          retention-days: 90

  publication_plan:
    needs: [regression, build_plan]
    if: ${{ !cancelled() && needs.regression.result == 'success' && ((github.event_name == 'workflow_dispatch' && (inputs.operation == 'validate-repair' || inputs.operation == 'repair-existing')) || (needs.build_plan.result == 'success' && needs.build_plan.outputs.build_required == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      native_matrix: ${{ steps.plan.outputs.native_matrix }}
      upgrade_matrix: ${{ steps.plan.outputs.upgrade_matrix }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      build_required: ${{ steps.state.outputs.build_required }}
      version: ${{ steps.identity.outputs.version }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      mode: ${{ steps.identity.outputs.mode }}
      plan_artifact_id: ${{ steps.plan_upload.outputs.artifact-id }}
      upstream_artifact_id: ${{ steps.upstream_upload.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.build_plan.outputs.version || inputs.version }}
      RELEASE_TAG: ${{ needs.build_plan.outputs.release_tag || inputs.release_tag }}
      MODE: ${{ needs.build_plan.outputs.mode || inputs.mode || 'stable' }}
      UPSTREAM_SOURCE: ${{ inputs.upstream_source || 'release' }}
      UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id }}
      UPSTREAM_ARTIFACT_ID: ${{ inputs.upstream_artifact_id }}
      UPSTREAM_ARTIFACT_SHA256: ${{ inputs.upstream_artifact_sha256 }}
      UPSTREAM_BUILD_COMMIT: ${{ inputs.upstream_build_commit }}
      PUBLICATION_OPERATION: ${{ inputs.operation || 'build' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned semantic validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - name: Resolve the exact package matrix and shared upstream input
        id: plan
        env:
          CANDIDATE_PREDECESSOR: ${{ inputs.candidate_predecessor }}
        run: |
          python3 scripts/package_matrix.py plan --repository "$GITHUB_REPOSITORY" --version "$VERSION" \
            --tag "${RELEASE_TAG:-$VERSION}" --mode "$MODE" --work matrix-input --upstream-source "$UPSTREAM_SOURCE" \
            --run-id "$UPSTREAM_RUN_ID" --artifact-id "$UPSTREAM_ARTIFACT_ID" \
            --artifact-sha256 "$UPSTREAM_ARTIFACT_SHA256" --build-commit "$UPSTREAM_BUILD_COMMIT"
      - name: Export effective version identity
        id: identity
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG:-$VERSION}" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Check exact current automatic acceptance
        id: state
        env:
          ONEPANEL_RESOLVED_PLAN: ${{ github.workspace }}/matrix-input/plan.json
          ONEPANEL_RESOLVED_PLAN_SHA256: ${{ steps.plan.outputs.plan_sha256 }}
        run: |
          if [[ "$PUBLICATION_OPERATION" == build ]]; then
            state=$(python3 scripts/runtime_publication.py status --repository "$GITHUB_REPOSITORY" --version "$VERSION" --tag "${RELEASE_TAG:-$VERSION}")
            if [[ "$state" == verified ]]; then
              echo 'build_required=false' >> "$GITHUB_OUTPUT"
            else
              [[ "$state" == absent || "$state" == draft || "$state" == rebuild ]]
              echo 'build_required=true' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        id: plan_upload
        with:
          name: package-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: matrix-input/plan.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: upstream_upload
        if: steps.plan.outputs.upstream_ready == 'true'
        with:
          name: package-upstream-${{ github.run_id }}-${{ github.run_attempt }}
          path: matrix-input/upstream-input/
          if-no-files-found: error
  publication_packages:
    name: publication_packages (${{ matrix.source }}, ${{ matrix.arch }})
    if: ${{ !cancelled() && needs.publication_plan.result == 'success' && needs.publication_plan.outputs.build_required == 'true' }}
    needs: publication_plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.publication_plan.outputs.matrix) }}
    env:
      VERSION: ${{ needs.publication_plan.outputs.version }}
      RELEASE_TAG: ${{ needs.publication_plan.outputs.release_tag }}
      MODE: ${{ needs.publication_plan.outputs.mode }}
      PACKAGE_SOURCE: ${{ matrix.source }}
      PACKAGE_ARCH: ${{ matrix.arch }}
      ONEPANEL_RESOLVED_PLAN: ${{ github.workspace }}/matrix-input/plan.json
      ONEPANEL_RESOLVED_PLAN_SHA256: ${{ needs.publication_plan.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned semantic validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publication_plan.outputs.plan_artifact_id }}
          merge-multiple: true
          path: matrix-input
      - uses: actions/download-artifact@v4
        if: matrix.source == 'custom' && needs.publication_plan.outputs.upstream_artifact_id != ''
        with:
          artifact-ids: ${{ needs.publication_plan.outputs.upstream_artifact_id }}
          merge-multiple: true
          path: matrix-input/upstream-input
      - uses: actions/cache@v4
        with:
          path: |
            build/cache/docker-*
            build/cache/docker-compose-*
          key: docker-payloads-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('docker-sources.json', 'compose-sources.json') }}
      - name: Install pinned per-package producer validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - name: Build and validate one package shard
        run: |
          python3 scripts/package_matrix.py shard --repository "$GITHUB_REPOSITORY" --version "$VERSION" \
            --tag "${RELEASE_TAG:-$VERSION}" --mode "$MODE" --work matrix-input --source "$PACKAGE_SOURCE" --arch "$PACKAGE_ARCH" --output package-shard
      - name: Report failed package branch in Actions
        if: failure()
        run: |
          echo "::warning::Missing package branch $PACKAGE_SOURCE/$PACKAGE_ARCH; see this job's failing validation step."
          echo "- Missing package branch $PACKAGE_SOURCE/$PACKAGE_ARCH; inspect this job for the exact reason." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: package-shard-${{ github.run_attempt }}-${{ matrix.key }}
          path: package-shard/
          if-no-files-found: error
          retention-days: 14
  publication_prepare:
    if: ${{ !cancelled() && needs.publication_plan.result == 'success' && (needs.publication_packages.result == 'success' || needs.publication_packages.result == 'failure') }}
    needs: [publication_plan, publication_packages]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      controls_artifact_id: ${{ steps.controls.outputs.artifact-id }}
      receipt_sha256: ${{ steps.receipt.outputs.sha256 }}
      native_matrix: ${{ steps.aggregate.outputs.native_matrix }}
      native_count: ${{ steps.aggregate.outputs.native_count }}
      upgrade_matrix: ${{ steps.aggregate.outputs.upgrade_matrix }}
      upgrade_count: ${{ steps.aggregate.outputs.upgrade_count }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ONEPANEL_RESOLVED_PLAN: ${{ github.workspace }}/matrix-input/plan.json
      ONEPANEL_RESOLVED_PLAN_SHA256: ${{ needs.publication_plan.outputs.plan_sha256 }}
      VERSION: ${{ needs.publication_plan.outputs.version }}
      RELEASE_TAG: ${{ needs.publication_plan.outputs.release_tag }}
      MODE: ${{ needs.publication_plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned semantic validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publication_plan.outputs.plan_artifact_id }}
          merge-multiple: true
          path: matrix-input
      - uses: actions/download-artifact@v4
        with:
          pattern: package-shard-*
          path: package-shards
      - name: Assemble all independently successful package branches
        id: aggregate
        run: |
          python3 scripts/package_matrix.py aggregate --repository "$GITHUB_REPOSITORY" --version "$VERSION" \
            --tag "${RELEASE_TAG:-$VERSION}" --mode "$MODE" --work matrix-input --shards package-shards --output publication-work
      - name: Bind the exact validation receipt
        id: receipt
        run: |
          receipt_sha=$(sha256sum publication-work/control/release-validation.json | cut -d' ' -f1)
          echo "sha256=$receipt_sha" >> "$GITHUB_OUTPUT"
          echo "VERIFIED_RELEASE_RECEIPT_SHA256=$receipt_sha"
      - name: Save small package validation controls separately
        id: controls
        uses: actions/upload-artifact@v4
        with:
          name: publication-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication-work/control/release-validation.json
            publication-work/release/checksums.txt
            matrix-input/plan.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: verified-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication-work/release/
            publication-work/control/
            publication-work/verification/
          if-no-files-found: error
          retention-days: 14
  publication_native:
    if: ${{ !cancelled() && needs.publication_plan.result == 'success' && needs.publication_prepare.result == 'success' && needs.publication_prepare.outputs.native_count != '0' }}
    needs: [publication_plan, publication_prepare]
    name: publication_native (${{ matrix.source }}, ${{ matrix.arch }}, ${{ matrix.scenario }})
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.publication_prepare.outputs.native_matrix) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.publication_plan.outputs.version }}
      RELEASE_TAG: ${{ needs.publication_plan.outputs.release_tag }}
      SOURCE: ${{ matrix.source }}
      ARCH: ${{ matrix.arch }}
      SCENARIO: ${{ matrix.scenario }}
      PUBLICATION_OPERATION: ${{ inputs.operation || 'build' }}
      ONEPANEL_RESOLVED_PLAN: ${{ github.workspace }}/matrix-input/plan.json
      ONEPANEL_RESOLVED_PLAN_SHA256: ${{ needs.publication_plan.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned native input validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publication_plan.outputs.plan_artifact_id }}
          merge-multiple: true
          path: matrix-input
      - name: Fetch exact same-run candidate shard and bind producer evidence
        id: candidate
        env:
          CANDIDATE_PREDECESSOR: ${{ inputs.candidate_predecessor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_OPERATION: ${{ inputs.operation || 'build' }}
          CONTROLS_ARTIFACT_ID: ${{ needs.publication_prepare.outputs.controls_artifact_id }}
          EXPECTED_RECEIPT_SHA256: ${{ needs.publication_prepare.outputs.receipt_sha256 }}
        run: |
          python3 scripts/native_candidate_input.py --version "$VERSION" --tag "$RELEASE_TAG" --source "$SOURCE" --arch "$ARCH" \
            --controls-artifact-id "$CONTROLS_ARTIFACT_ID" --receipt-sha256 "$EXPECTED_RECEIPT_SHA256" \
            --output "$RUNNER_TEMP/native-input" --provenance "$RUNNER_TEMP/native-input-provenance.json"
      - name: Independently validate candidate payload and safely unpack
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys
          sys.path.insert(0,'scripts')
          from validate_release import validate
          from validate_resolved_custom import archive_bytes
          from native_upgrade_input import write_verified_archive
          from release_asset_repair import digest
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-input'
          version,source,arch=[os.environ[k] for k in ['VERSION','SOURCE','ARCH']]
          matrix={source:[arch]}
          if source=='enterprise-docker': matrix['enterprise-original']=[arch]
          (root/'matrix.json').write_text(json.dumps(matrix))
          packages=sorted(root.glob('*/*.tar.gz'))
          (root/'checksums.txt').write_text(''.join(digest(p)['sha256']+'  '+p.name+'\n' for p in packages))
          validate(root,version,root/'matrix.json')
          target=root/source/f'1panel-{version}-{source}-offline-linux-{arch}.tar.gz'
          destination=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-package'
          provenance=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'native-input-provenance.json').read_text())
          pin=provenance['files'][source+'/'+target.name]
          archive_root=f'1panel-{version}-linux-{arch}' if source=='enterprise-docker' else target.name.removesuffix('.tar.gz')
          modes={}
          body=archive_bytes(target,pin,archive_root,modes=modes)
          package=write_verified_archive(body,modes,destination,archive_root)
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('NATIVE_PACKAGE='+str(package)+'\n')
          PY
      - name: Install and verify real native candidate services
        env:
          EXPECTED_SHA256: ${{ steps.candidate.outputs.archive_sha256 }}
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_TEMP "$RUNNER_TEMP/validation-python/bin/python3" scripts/native_install_smoke.py \
            --package "$NATIVE_PACKAGE" --version "$VERSION" --docker-scenario "$SCENARIO" \
            --archive-sha256 "$EXPECTED_SHA256" --result "$RUNNER_TEMP/native-result.json"
      - name: Bind real installation result to exact run and hosted runner
        env:
          CANDIDATE_PREDECESSOR: ${{ inputs.candidate_predecessor }}
        run: |
          python3 scripts/runtime_native_acceptance.py stamp --kind install \
            --version "$VERSION" --tag "$RELEASE_TAG" --source "$SOURCE" --arch "$ARCH" --scenario "$SCENARIO" \
            --candidate "$RUNNER_TEMP/native-input-provenance.json" \
            --result "$RUNNER_TEMP/native-result.json" --output "$RUNNER_TEMP/native-evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ github.run_attempt }}-install-${{ matrix.source }}-${{ matrix.arch }}-${{ matrix.scenario }}
          path: ${{ runner.temp }}/native-evidence.json
          if-no-files-found: error
          retention-days: 14
  publication_upgrade:
    # Install matrix can have failures in unrelated products. The final acceptance
    # job admits each product separately. Shared planner/preparation failure blocks.
    if: ${{ !cancelled() && needs.publication_plan.result == 'success' && needs.publication_prepare.result == 'success' && (needs.publication_native.result == 'success' || needs.publication_native.result == 'failure' || needs.publication_native.result == 'skipped') && needs.publication_prepare.outputs.upgrade_count != '0' }}
    needs: [publication_plan, publication_prepare, publication_native]
    name: publication_upgrade (${{ matrix.source }}, ${{ matrix.arch }})
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.publication_prepare.outputs.upgrade_matrix) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 35
    env:
      VERSION: ${{ needs.publication_plan.outputs.version }}
      RELEASE_TAG: ${{ needs.publication_plan.outputs.release_tag }}
      SOURCE: ${{ matrix.source }}
      ARCH: ${{ matrix.arch }}
      PUBLICATION_OPERATION: ${{ inputs.operation || 'build' }}
      ONEPANEL_RESOLVED_PLAN: ${{ github.workspace }}/matrix-input/plan.json
      ONEPANEL_RESOLVED_PLAN_SHA256: ${{ needs.publication_plan.outputs.plan_sha256 }}
      CONTROLS_ARTIFACT_ID: ${{ needs.publication_prepare.outputs.controls_artifact_id }}
      EXPECTED_RECEIPT_SHA256: ${{ needs.publication_prepare.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install validation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publication_plan.outputs.plan_artifact_id }}
          merge-multiple: true
          path: matrix-input
      - name: Authenticate target and explicit candidate or canonical public predecessor
        env:
          CANDIDATE_PREDECESSOR: ${{ inputs.candidate_predecessor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/native_candidate_input.py --version "$VERSION" --tag "$RELEASE_TAG" --source "$SOURCE" --arch "$ARCH" \
            --controls-artifact-id "$CONTROLS_ARTIFACT_ID" --receipt-sha256 "$EXPECTED_RECEIPT_SHA256" \
            --output "$RUNNER_TEMP/native-input" --provenance "$RUNNER_TEMP/native-input-provenance.json"
          python3 scripts/native_upgrade_input.py --version "$VERSION" --tag "$RELEASE_TAG" --source "$SOURCE" --arch "$ARCH" \
            --target-input "$RUNNER_TEMP/native-input" --target-provenance "$RUNNER_TEMP/native-input-provenance.json" \
            --target-controls-id "$CONTROLS_ARTIFACT_ID" --target-receipt-sha256 "$EXPECTED_RECEIPT_SHA256" \
            --output "$RUNNER_TEMP/upgrade-input" --provenance "$RUNNER_TEMP/upgrade-input-provenance.json"
      - name: Install predecessor and verify real upgrade plus rollback
        env:
          CANDIDATE_PREDECESSOR: ${{ inputs.candidate_predecessor }}
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_TEMP,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,PUBLICATION_OPERATION,GITHUB_SERVER_URL,GITHUB_API_URL,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SHA,GITHUB_WORKFLOW_SHA,GITHUB_WORKFLOW_REF,RUNNER_ARCH,RUNNER_NAME,ONEPANEL_RESOLVED_PLAN,ONEPANEL_RESOLVED_PLAN_SHA256,CANDIDATE_PREDECESSOR \
            "$RUNNER_TEMP/validation-python/bin/python3" scripts/native_upgrade_smoke.py \
            --version "$VERSION" --tag "$RELEASE_TAG" --source "$SOURCE" --arch "$ARCH" \
            --provenance "$RUNNER_TEMP/upgrade-input-provenance.json" --result "$RUNNER_TEMP/upgrade-result.json"
      - name: Bind upgrade result and actual predecessor installation
        env:
          CANDIDATE_PREDECESSOR: ${{ inputs.candidate_predecessor }}
        run: |
          python3 scripts/runtime_native_acceptance.py stamp --kind upgrade \
            --version "$VERSION" --tag "$RELEASE_TAG" --source "$SOURCE" --arch "$ARCH" \
            --candidate "$RUNNER_TEMP/native-input-provenance.json" --result "$RUNNER_TEMP/upgrade-result.json" \
            --upgrade-input "$RUNNER_TEMP/upgrade-input-provenance.json" \
            --predecessor-install "$RUNNER_TEMP/predecessor-install-result.json" --output "$RUNNER_TEMP/native-evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ github.run_attempt }}-upgrade-${{ matrix.source }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-evidence.json
          if-no-files-found: error
          retention-days: 14
  publication_acceptance:
    if: ${{ !cancelled() && needs.publication_plan.result == 'success' && needs.publication_prepare.result == 'success' && (needs.publication_native.result == 'success' || needs.publication_native.result == 'failure' || needs.publication_native.result == 'skipped') && (needs.publication_upgrade.result == 'success' || needs.publication_upgrade.result == 'failure' || needs.publication_upgrade.result == 'skipped') }}
    needs: [publication_plan, publication_prepare, publication_native, publication_upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      receipt_sha256: ${{ steps.admit.outputs.receipt_sha256 }}
      native_acceptance_sha256: ${{ steps.admit.outputs.native_acceptance_sha256 }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.publication_plan.outputs.version }}
      RELEASE_TAG: ${{ needs.publication_plan.outputs.release_tag }}
      PUBLICATION_OPERATION: ${{ inputs.operation || 'build' }}
      ONEPANEL_RESOLVED_PLAN: ${{ github.workspace }}/matrix-input/plan.json
      ONEPANEL_RESOLVED_PLAN_SHA256: ${{ needs.publication_plan.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install validation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publication_plan.outputs.plan_artifact_id }}
          path: matrix-input
          merge-multiple: true
      - name: Authenticate package and native results and admit each product
        id: admit
        env:
          CANDIDATE_PREDECESSOR: ${{ inputs.candidate_predecessor }}
          PREPARED_ARTIFACT_ID: ${{ needs.publication_prepare.outputs.artifact_id }}
          CONTROLS_ARTIFACT_ID: ${{ needs.publication_prepare.outputs.controls_artifact_id }}
          EXPECTED_RECEIPT_SHA256: ${{ needs.publication_prepare.outputs.receipt_sha256 }}
        run: |
          python3 scripts/runtime_publication.py accept --version "$VERSION" --tag "$RELEASE_TAG" \
            --artifact-id "$PREPARED_ARTIFACT_ID" --controls-artifact-id "$CONTROLS_ARTIFACT_ID" \
            --receipt-sha256 "$EXPECTED_RECEIPT_SHA256" --output "$RUNNER_TEMP/final-publication"
      - uses: actions/upload-artifact@v4
        id: upload
        if: inputs.candidate_predecessor == ''
        with:
          name: native-admitted-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-publication/
          if-no-files-found: error
          retention-days: 14
      - name: Retain small final acceptance controls separately
        if: inputs.candidate_predecessor == ''
        uses: actions/upload-artifact@v4
        with:
          name: native-admitted-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/final-publication/release-validation.json
            ${{ runner.temp }}/final-publication/native-acceptance.json
            ${{ runner.temp }}/final-publication/checksums.txt
          if-no-files-found: error
          retention-days: 90
      - name: Retain complete read-only native recovery evidence
        if: inputs.candidate_predecessor != ''
        uses: actions/upload-artifact@v4
        with:
          name: read-only-native-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-publication/read-only-native-recovery.json
          if-no-files-found: error
          retention-days: 90
  publication_repair:
    concurrency:
      group: offline-release-${{ needs.publication_plan.outputs.release_tag }}
      queue: max
      cancel-in-progress: false
    if: ${{ !cancelled() && inputs.candidate_predecessor == '' && github.event_name == 'workflow_dispatch' && inputs.operation == 'repair-existing' && needs.publication_plan.result == 'success' && needs.publication_acceptance.result == 'success' }}
    needs: [publication_plan, publication_acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.publication_plan.outputs.version }}
      RELEASE_TAG: ${{ needs.publication_plan.outputs.release_tag }}
      PUBLICATION_OPERATION: ${{ inputs.operation }}
      ONEPANEL_RESOLVED_PLAN: ${{ github.workspace }}/matrix-input/plan.json
      ONEPANEL_RESOLVED_PLAN_SHA256: ${{ needs.publication_plan.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned semantic validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publication_plan.outputs.plan_artifact_id }}
          path: matrix-input
          merge-multiple: true
      - name: Authenticate admitted artifacts and repair recoverably
        env:
          CANDIDATE_PREDECESSOR: ${{ inputs.candidate_predecessor }}
          ACCEPTED_ARTIFACT_ID: ${{ needs.publication_acceptance.outputs.artifact_id }}
          EXPECTED_RECEIPT_SHA256: ${{ needs.publication_acceptance.outputs.receipt_sha256 }}
          EXPECTED_NATIVE_SHA256: ${{ needs.publication_acceptance.outputs.native_acceptance_sha256 }}
        run: |
          python3 scripts/runtime_publication.py publish --repository "$GITHUB_REPOSITORY" --version "$VERSION" --tag "$RELEASE_TAG" \
            --artifact-id "$ACCEPTED_ARTIFACT_ID" --receipt-sha256 "$EXPECTED_RECEIPT_SHA256" \
            --native-acceptance-sha256 "$EXPECTED_NATIVE_SHA256" --journal publication-work/control/repair-journal.json
      - name: Preserve publication journal on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-work/control/
          if-no-files-found: warn
          retention-days: 90
