name: Build 1Panel v2 Offline
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Install mode: stable | beta | dev'
        default: stable
      version:
        description: '1Panel version; empty resolves latest only for normal builds'
        default: ''
      operation:
        type: choice
        options: [build, validate-repair, repair-existing, validate-receipt, refresh-receipt]
        default: build
        description: Build/repair packages, or revalidate/refresh only the receipt of unchanged published packages
      upstream_source:
        type: choice
        options: [release, verified-ci]
        default: release
      upstream_run_id:
        description: Exact successful upstream run ID for verified-ci
        default: ''
      upstream_artifact_id:
        description: Exact upstream artifact ID for verified-ci
        default: ''
      upstream_artifact_sha256:
        description: Exact GitHub ZIP SHA-256 for verified-ci
        default: ''
      upstream_build_commit:
        description: Exact manifest built commit, possibly a PR merge commit
        default: ''
      release_tag:
        description: 'Release tag; receipt-only and existing repair modes require the version tag'
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('offline-pr-{0}', github.ref) || (inputs.operation == 'validate-repair' || inputs.operation == 'validate-receipt') && format('offline-validation-{0}', github.ref) || 'offline-release' }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned validation dependency in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - name: Run isolated regression and syntax checks
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile scripts/*.py
          bash -n prepare_offline.sh upgrade_offline.sh quick_start.sh
  build_plan:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'build')
    needs: regression
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      mode: ${{ steps.version.outputs.mode }}
      build_required: ${{ steps.version.outputs.build_required }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version and explicit matrix
        id: version
        run: |
          set -euo pipefail
          mode=${INPUT_MODE:-stable}
          [[ "$mode" =~ ^(stable|beta|dev)$ ]]
          version=${INPUT_VERSION:-$(curl --retry 3 -fsSL "https://resource.fit2cloud.com/1panel/package/v2/${mode}/latest")}
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          release_tag=${INPUT_RELEASE_TAG:-$version}
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9._-]*$ ]]
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          matrix="release-matrix-${version}.json"
          if [[ ! -f "$matrix" ]]; then
            echo "No resolved release matrix for $version. Complete source/edition/architecture discovery before building this version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          state=$(python3 scripts/check_release_state.py --repository "$GITHUB_REPOSITORY" --version "$version" --tag "$release_tag")
          if [[ "$state" == verified ]]; then
            echo 'Exact canonical matrix, server hashes, checksum bytes and validation receipt verified; no release changes needed.'
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          else
            [[ "$state" == absent || "$state" == draft ]]
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [build_plan, publication_prepare]
    if: always() && needs.build_plan.result == 'success' && needs.build_plan.outputs.build_required == 'true' && needs.publication_prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.build_plan.outputs.version }}
      EXPECTED_VALIDATION_RECEIPT_SHA256: ${{ needs.publication_prepare.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned historical validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publication_prepare.outputs.artifact_id }}
          path: publication-work
          merge-multiple: true
      - name: Revalidate complete prepared output before draft publication
        run: |
          echo "$EXPECTED_VALIDATION_RECEIPT_SHA256  publication-work/control/release-validation.json" | sha256sum -c -
          python3 scripts/validate_release.py publication-work/release "$VERSION" "release-matrix-$VERSION.json"
          mkdir -p build
          mv publication-work/release "build/$VERSION"
          cp publication-work/control/release-validation.json "build/$VERSION/release-validation.json"
      - name: Stage verified assets in a draft, then publish
        env:
          RELEASE_TAG: ${{ needs.build_plan.outputs.release_tag }}
          VERSION: ${{ needs.build_plan.outputs.version }}
          MATRIX: release-matrix-${{ needs.build_plan.outputs.version }}.json
        run: |
          set -euo pipefail
          # Never overwrite a public release piecemeal. A correction is a new release tag.
          if gh release view "$RELEASE_TAG" --json isDraft -q '.isDraft' > release-state.txt 2>/dev/null; then
            [[ "$(cat release-state.txt)" == true ]] || { echo 'Public release already exists; use a reviewed correction tag/process.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --draft --title "$VERSION" --notes 'Validated offline payloads; see included source manifests.'
          fi
          mapfile -t assets < <(find "build/$VERSION" -mindepth 2 -maxdepth 2 -name '*.tar.gz' | sort)
          gh release upload "$RELEASE_TAG" "${assets[@]}" "build/$VERSION/checksums.txt" "build/$VERSION/release-validation.json" --clobber
          # Verify remote asset completeness before making the draft visible.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > remote-assets.json
          python3 - "$VERSION" "$MATRIX" <<'PY'
          import hashlib,json,sys
          version,matrix=sys.argv[1:]
          wanted={f'1panel-{version}-{s}-offline-linux-{a}.tar.gz' for s,arches in json.load(open(matrix)).items() for a in arches}|{'checksums.txt','release-validation.json'}
          assets=json.load(open('remote-assets.json'))['assets']
          assert {a['name'] for a in assets}==wanted, 'Remote asset matrix mismatch'
          expected={}
          for line in open(f'build/{version}/checksums.txt'):
              digest,name=line.rstrip().split('  ',1); expected[name]='sha256:'+digest
          expected['checksums.txt']='sha256:'+hashlib.sha256(open(f'build/{version}/checksums.txt','rb').read()).hexdigest()
          expected['release-validation.json']='sha256:'+hashlib.sha256(open(f'build/{version}/release-validation.json','rb').read()).hexdigest()
          assert all(a['size']>0 and a.get('digest')==expected[a['name']] for a in assets), 'Remote content digest mismatch'
          PY
          gh release edit "$RELEASE_TAG" --draft=false

  publication_plan:
    needs: [regression, build_plan]
    if: always() && needs.regression.result == 'success' && ((github.event_name == 'workflow_dispatch' && (inputs.operation == 'validate-repair' || inputs.operation == 'repair-existing')) || needs.build_plan.outputs.build_required == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      native_matrix: ${{ steps.plan.outputs.native_matrix }}
      version: ${{ steps.identity.outputs.version }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      mode: ${{ steps.identity.outputs.mode }}
      plan_artifact_id: ${{ steps.plan_upload.outputs.artifact-id }}
      upstream_artifact_id: ${{ steps.upstream_upload.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.build_plan.outputs.version || inputs.version }}
      RELEASE_TAG: ${{ needs.build_plan.outputs.release_tag || inputs.release_tag }}
      MODE: ${{ needs.build_plan.outputs.mode || inputs.mode || 'stable' }}
      UPSTREAM_SOURCE: ${{ inputs.upstream_source || 'release' }}
      UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id }}
      UPSTREAM_ARTIFACT_ID: ${{ inputs.upstream_artifact_id }}
      UPSTREAM_ARTIFACT_SHA256: ${{ inputs.upstream_artifact_sha256 }}
      UPSTREAM_BUILD_COMMIT: ${{ inputs.upstream_build_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned historical validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - name: Resolve the exact package matrix and shared upstream input
        id: plan
        run: |
          python3 scripts/package_matrix.py plan --repository "$GITHUB_REPOSITORY" --version "$VERSION" \
            --tag "${RELEASE_TAG:-$VERSION}" --mode "$MODE" --work matrix-input --upstream-source "$UPSTREAM_SOURCE" \
            --run-id "$UPSTREAM_RUN_ID" --artifact-id "$UPSTREAM_ARTIFACT_ID" \
            --artifact-sha256 "$UPSTREAM_ARTIFACT_SHA256" --build-commit "$UPSTREAM_BUILD_COMMIT"
      - name: Export effective version identity
        id: identity
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG:-$VERSION}" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: plan_upload
        with:
          name: package-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: matrix-input/plan.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: upstream_upload
        if: inputs.upstream_source == 'verified-ci'
        with:
          name: package-upstream-${{ github.run_id }}-${{ github.run_attempt }}
          path: matrix-input/upstream-input/
          if-no-files-found: error
  publication_packages:
    if: always() && needs.publication_plan.result == 'success'
    needs: publication_plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.publication_plan.outputs.matrix) }}
    env:
      VERSION: ${{ needs.publication_plan.outputs.version }}
      RELEASE_TAG: ${{ needs.publication_plan.outputs.release_tag }}
      MODE: ${{ needs.publication_plan.outputs.mode }}
      PACKAGE_SOURCE: ${{ matrix.source }}
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned historical validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publication_plan.outputs.plan_artifact_id }}
          merge-multiple: true
          path: matrix-input
      - uses: actions/download-artifact@v4
        if: matrix.source == 'custom' && inputs.upstream_source == 'verified-ci'
        with:
          artifact-ids: ${{ needs.publication_plan.outputs.upstream_artifact_id }}
          merge-multiple: true
          path: matrix-input/upstream-input
      - uses: actions/cache@v4
        with:
          path: |
            build/cache/docker-*
            build/cache/docker-compose-*
          key: docker-payloads-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('docker-sources.json', 'compose-sources.json') }}
      - name: Install pinned per-package producer validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - name: Build and validate one package shard
        run: |
          python3 scripts/package_matrix.py shard --repository "$GITHUB_REPOSITORY" --version "$VERSION" \
            --tag "${RELEASE_TAG:-$VERSION}" --mode "$MODE" --work matrix-input --source "$PACKAGE_SOURCE" --arch "$PACKAGE_ARCH" --output package-shard
      - uses: actions/upload-artifact@v4
        with:
          name: package-shard-${{ github.run_attempt }}-${{ matrix.key }}
          path: package-shard/
          if-no-files-found: error
          retention-days: 14
  publication_prepare:
    if: always() && needs.publication_plan.result == 'success' && needs.publication_packages.result == 'success'
    needs: [publication_plan, publication_packages]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      controls_artifact_id: ${{ steps.controls.outputs.artifact-id }}
      receipt_sha256: ${{ steps.receipt.outputs.sha256 }}
    env:
      VERSION: ${{ needs.publication_plan.outputs.version }}
      RELEASE_TAG: ${{ needs.publication_plan.outputs.release_tag }}
      MODE: ${{ needs.publication_plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned historical validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publication_plan.outputs.plan_artifact_id }}
          merge-multiple: true
          path: matrix-input
      - uses: actions/download-artifact@v4
        with:
          pattern: package-shard-*
          path: package-shards
      - name: Assemble and independently validate every expected package
        run: |
          python3 scripts/package_matrix.py aggregate --repository "$GITHUB_REPOSITORY" --version "$VERSION" \
            --tag "${RELEASE_TAG:-$VERSION}" --mode "$MODE" --work matrix-input --shards package-shards --output publication-work
      - name: Bind the exact validation receipt
        id: receipt
        run: |
          receipt_sha=$(sha256sum publication-work/control/release-validation.json | cut -d' ' -f1)
          echo "sha256=$receipt_sha" >> "$GITHUB_OUTPUT"
          echo "VERIFIED_RELEASE_RECEIPT_SHA256=$receipt_sha"
      - name: Save small package validation controls separately
        id: controls
        uses: actions/upload-artifact@v4
        with:
          name: publication-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication-work/control/release-validation.json
            publication-work/release/checksums.txt
            matrix-input/plan.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: verified-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication-work/release/
            publication-work/control/
          if-no-files-found: error
          retention-days: 14
  publication_native:
    if: always() && github.event_name == 'workflow_dispatch' && (inputs.operation == 'validate-repair' || inputs.operation == 'repair-existing') && needs.publication_plan.result == 'success' && needs.publication_prepare.result == 'success'
    needs: [publication_plan, publication_prepare]
    name: publication_native (${{ matrix.source }}, ${{ matrix.arch }}, ${{ matrix.scenario }})
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.publication_plan.outputs.native_matrix) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.publication_plan.outputs.version }}
      RELEASE_TAG: ${{ needs.publication_plan.outputs.release_tag }}
      SOURCE: ${{ matrix.source }}
      ARCH: ${{ matrix.arch }}
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned native input validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - name: Fetch exact same-run candidate shard and bind producer evidence
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_OPERATION: ${{ inputs.operation }}
          CONTROLS_ARTIFACT_ID: ${{ needs.publication_prepare.outputs.controls_artifact_id }}
          EXPECTED_RECEIPT_SHA256: ${{ needs.publication_prepare.outputs.receipt_sha256 }}
        run: |
          python3 scripts/native_candidate_input.py --version "$VERSION" --tag "$RELEASE_TAG" --source "$SOURCE" --arch "$ARCH" \
            --controls-artifact-id "$CONTROLS_ARTIFACT_ID" --receipt-sha256 "$EXPECTED_RECEIPT_SHA256" \
            --output "$RUNNER_TEMP/native-input" --provenance "$RUNNER_TEMP/native-input-provenance.json"
      - name: Independently validate candidate payload and safely unpack
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys,tarfile
          sys.path.insert(0,'scripts')
          from validate_release import validate
          from validate_payload import members
          from release_asset_repair import digest
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-input'
          version,source,arch=[os.environ[k] for k in ['VERSION','SOURCE','ARCH']]
          matrix={source:[arch]}
          if source=='enterprise-docker': matrix['enterprise-original']=[arch]
          (root/'matrix.json').write_text(json.dumps(matrix))
          packages=sorted(root.glob('*/*.tar.gz'))
          (root/'checksums.txt').write_text(''.join(digest(p)['sha256']+'  '+p.name+'\n' for p in packages))
          validate(root,version,root/'matrix.json')
          target=root/source/f'1panel-{version}-{source}-offline-linux-{arch}.tar.gz'
          destination=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-package'
          destination.mkdir()
          with tarfile.open(target,'r:gz') as archive:
              members(archive)
              archive.extractall(destination,filter='data')
          children=list(destination.iterdir())
          assert len(children)==1 and children[0].is_dir()
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('NATIVE_PACKAGE='+str(children[0])+'\n')
          PY
      - name: Install and verify real native candidate services
        env:
          EXPECTED_SHA256: ${{ steps.candidate.outputs.archive_sha256 }}
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_TEMP python3 scripts/native_install_smoke.py \
            --package "$NATIVE_PACKAGE" --version "$VERSION" --docker-scenario "$SCENARIO" \
            --archive-sha256 "$EXPECTED_SHA256" --result "$RUNNER_TEMP/native-result.json"
      - name: Save exact candidate provenance and native result
        uses: actions/upload-artifact@v4
        with:
          name: publication-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.source }}-${{ matrix.arch }}-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/native-input-provenance.json
            ${{ runner.temp }}/native-result.json
          if-no-files-found: error
          retention-days: 14
  publication_repair:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.operation == 'repair-existing' && needs.publication_prepare.result == 'success' && needs.publication_native.result == 'success'
    needs: [publication_prepare, publication_native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PUBLICATION_OPERATION: ${{ inputs.operation }}
      EXPECTED_VALIDATION_RECEIPT_SHA256: ${{ needs.publication_prepare.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned historical validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publication_prepare.outputs.artifact_id }}
          path: publication-work
          merge-multiple: true
      - name: Revalidate, stage, read back and repair recoverably
        run: |
          RELEASE_TAG=${RELEASE_TAG:-$VERSION}
          python3 scripts/manual_publication.py publish \
            --repository "$GITHUB_REPOSITORY" --version "$VERSION" --tag "$RELEASE_TAG" --work publication-work
      - name: Preserve publication journal on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-work/control/
          if-no-files-found: warn
          retention-days: 90
  publication_revalidate:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'validate-receipt' || inputs.operation == 'refresh-receipt')
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      receipt_sha256: ${{ steps.receipt.outputs.sha256 }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned historical validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - name: Revalidate the existing complete published package set without rebuilding
        run: |
          python3 scripts/package_matrix.py revalidate --repository "$GITHUB_REPOSITORY" --version "$VERSION" \
            --tag "${RELEASE_TAG:-$VERSION}" --work receipt-work
      - name: Bind the exact revalidation receipt
        id: receipt
        run: |
          receipt_sha=$(sha256sum receipt-work/control/release-validation.json | cut -d' ' -f1)
          echo "sha256=$receipt_sha" >> "$GITHUB_OUTPUT"
          echo "VERIFIED_RELEASE_RECEIPT_SHA256=$receipt_sha"
      - name: Save small existing-byte validation controls separately
        uses: actions/upload-artifact@v4
        with:
          name: receipt-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            receipt-work/control/release-validation.json
            receipt-work/control/previous-release-validation.json
            receipt-work/release/checksums.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: verified-receipt-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            receipt-work/release/
            receipt-work/control/
          if-no-files-found: error
          retention-days: 14
  publication_receipt_refresh:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'refresh-receipt'
    needs: publication_revalidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PUBLICATION_OPERATION: ${{ inputs.operation }}
      EXPECTED_VALIDATION_RECEIPT_SHA256: ${{ needs.publication_revalidate.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned historical validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/python3" -m pip install --disable-pip-version-check -r requirements-validation.txt
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publication_revalidate.outputs.artifact_id }}
          path: receipt-work
          merge-multiple: true
      - name: Revalidate unchanged inputs and replace only the receipt recoverably
        run: |
          python3 scripts/manual_publication.py refresh-receipt \
            --repository "$GITHUB_REPOSITORY" --version "$VERSION" --tag "${RELEASE_TAG:-$VERSION}" --work receipt-work
      - name: Preserve receipt-refresh journal on success or failure
        if: always()
        # Export failure must not invalidate a successfully published receipt.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: receipt-refresh-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt-work/control/
          if-no-files-found: warn
          retention-days: 90
